<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Atrasos y Subida Salarial - CGT</title>
    <style>
        :root {
            --primary-color: #c8102e; /* Rojo CGT */
            --dark-color: #1a1a1a;
            --light-bg: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #111 url('https://upload.wikimedia.org/wikipedia/commons/a/a9/Logo_CGT_Espa%C3%B1a.svg') no-repeat center center fixed;
            background-size: 35%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--light-bg);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 950px;
            padding: 25px;
            border-top: 6px solid var(--primary-color);
        }

        h1 {
            color: var(--dark-color);
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-color);
        }

        .input-group.deduction label {
            color: #c8102e;
        }

        .input-group.deduction input {
            border-color: #f5c6cb;
            background-color: #fff5f5;
        }

        .input-group.highlight-box {
            background-color: #fdf2f2;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed var(--primary-color);
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--dark-color);
            color: white;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .diff-positive {
            color: #2e7d32;
            font-weight: bold;
        }

        .diff-negative {
            color: #c8102e;
            font-weight: bold;
        }

        .total-box {
            background-color: var(--dark-color);
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .total-box div span {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
        }

        .total-box div strong {
            font-size: 1.4rem;
            color: #fff;
        }

        .total-box .increment {
            color: #4caf50;
            font-size: 1.5rem;
        }

        @media (max-width: 600px) {
            body {
                background-size: 70%;
            }
            .container {
                padding: 15px;
            }
            th, td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de Atrasos y Subida Salarial</h1>
    <p class="subtitle">Cálculo de diferidos descontando el 2,9% ya abonado (pendiente real: 1,1% sobre subida total)</p>

    <form id="salaryForm" class="grid-form">
        <div class="input-group highlight-box">
            <label for="categoria">Categoría / Promoción Profesional</label>
            <select id="categoria">
                <option value="mozo">Mozo (Sin cambio)</option>
                <option value="especialista">Mozo Especialista (Sin cambio)</option>
                <option value="cambio_especialista">Promoción: Cambio de Mozo a Mozo Especialista</option>
            </select>
        </div>
        <div class="input-group highlight-box" id="grupoMesesEspecialista" style="display: none;">
            <label for="mesesComoEspecialista">Meses como Mozo Especialista</label>
            <input type="number" id="mesesComoEspecialista" min="0" max="12" value="" placeholder="Ej: 10 (Marzo a Diciembre)">
        </div>
        <div class="input-group highlight-box">
            <label for="horasSemanales">Horas Semanales de Contrato (Dec.)</label>
            <input type="number" id="horasSemanales" min="1" max="40" step="0.5" value="" placeholder="Ej: 40">
        </div>
        <div class="input-group highlight-box">
            <label for="mesesAtrasos">Meses de Atrasos a calcular</label>
            <input type="number" id="mesesAtrasos" min="0" step="1" value="" placeholder="Ej: 12">
        </div>
        <div class="input-group highlight-box">
            <label for="horasMensualesBase">Total Horas Mensuales (para Salario Base)</label>
            <input type="number" id="horasMensualesBase" min="0" step="0.5" value="" placeholder="Ej: 160">
        </div>
        <div class="input-group highlight-box">
            <label for="antiguedadMensual">Plus Antigüedad Mensual (€ actual)</label>
            <input type="number" id="antiguedadMensual" min="0" step="0.01" value="" placeholder="Ej: 50.00">
        </div>
        <div class="input-group highlight-box">
            <label for="mesesAntiguedad">Meses cobrando Antigüedad en el periodo</label>
            <input type="number" id="mesesAntiguedad" min="0" max="12" step="1" value="" placeholder="Ej: 6 (Si empezó a mitad de año)">
        </div>
        <div class="input-group highlight-box">
            <label for="nocturnidadFijaMensual">Plus Nocturnidad Fijo Mensual (€ actual)</label>
            <input type="number" id="nocturnidadFijaMensual" min="0" step="0.01" value="" placeholder="Ej: 120.00 (Si aplica)">
        </div>
        <div class="input-group">
            <label for="horasOrdinarias">Total Horas Ordinarias (Extra / Realizadas)</label>
            <input type="number" id="horasOrdinarias" min="0" step="0.5" value="" placeholder="0">
        </div>
        <div class="input-group">
            <label for="horasNocturnas">Total Horas Nocturnas (Variables)</label>
            <input type="number" id="horasNocturnas" min="0" step="0.5" value="" placeholder="0">
        </div>
        <div class="input-group">
            <label for="horasComplDiurnas">Total Horas Compl. Diurnas</label>
            <input type="number" id="horasComplDiurnas" min="0" step="0.5" value="" placeholder="0">
        </div>
        <div class="input-group">
            <label for="horasComplNocturnas">Total Horas Compl. Nocturnas</label>
            <input type="number" id="horasComplNocturnas" min="0" step="0.5" value="" placeholder="0">
        </div>
        <div class="input-group">
            <label for="domingostRotativos">Total Domingos Rotativos</label>
            <input type="number" id="domingostRotativos" min="0" value="" placeholder="0">
        </div>
        <div class="input-group">
            <label for="plusFestivoComple">Total Plus Festivo/Dom. Comple</label>
            <input type="number" id="plusFestivoComple" min="0" value="" placeholder="0">
        </div>
        <div class="input-group deduction">
            <label for="mejoraVoluntaria">Mejora Voluntaria Percibida (€ a descontar)</label>
            <input type="number" id="mejoraVoluntaria" min="0" step="0.01" value="" placeholder="Ej: 150.00">
        </div>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th>Valor Anterior</th>
                    <th>Valor Nuevo</th>
                    <th>Diferencia / Ud.</th>
                    <th>Total Estimado</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                <!-- Se genera dinámicamente -->
            </tbody>
        </table>
    </div>

    <div class="total-box">
        <div>
            <span>Bruto Atrasos Generados</span>
            <strong id="totalBruto">0,00 €</strong>
        </div>
        <div>
            <span>Deducción (Mejora Vol.)</span>
            <strong id="totalDeduccion" style="color: #ff6b6b;">-0,00 €</strong>
        </div>
        <div>
            <span>Neto Estimado Atrasos</span>
            <strong id="totalNeto" class="increment">0,00 €</strong>
        </div>
    </div>
</div>

<script>
    const TARIFAS = {
        horasOrdinarias: { nombre: 'Hora Ordinaria', ant: 10.92, nua: 11.36 },
        horasNocturnas: { nombre: 'Hora Nocturna (Variable)', ant: 13.15, nua: 11.36 + 2.32 },
        horasComplDiurnas: { nombre: 'Hora Compl. Diurna', ant: 10.05, nua: 10.05 },
        horasComplNocturnas: { nombre: 'Hora Compl. Nocturna', ant: 12.28, nua: 12.28 },
        domingostRotativos: { nombre: 'Domingo Rotativo', ant: 85.725, nua: 89.15 },
        plusFestivoComple: { nombre: 'Plus Festivo / Dom. Comple', ant: 174.13, nua: 181.10 }
    };

    const categoriaSelect = document.getElementById('categoria');
    const grupoMesesEspecialista = document.getElementById('grupoMesesEspecialista');

    categoriaSelect.addEventListener('change', () => {
        if (categoriaSelect.value === 'cambio_especialista') {
            grupoMesesEspecialista.style.display = 'flex';
        } else {
            grupoMesesEspecialista.style.display = 'none';
        }
        calcular();
    });

    function calcular() {
        const tbody = document.getElementById('resultsTable');
        tbody.innerHTML = '';

        let brutoAtrasos = 0;
        const horasSemanales = parseFloat(document.getElementById('horasSemanales').value) || 0;
        const mesesAtrasos = parseInt(document.getElementById('mesesAtrasos').value) || 0;
        const horasMensualesBase = parseFloat(document.getElementById('horasMensualesBase').value) || 0;
        const antiguedadMensual = parseFloat(document.getElementById('antiguedadMensual').value) || 0;
        
        // Si no se introduce un valor de meses de antigüedad, por defecto toma todos los meses de atrasos
        const inputMesesAntiguedad = document.getElementById('mesesAntiguedad').value;
        const mesesAntiguedad = inputMesesAntiguedad !== "" ? parseInt(inputMesesAntiguedad) || 0 : mesesAtrasos;
        
        const nocturnidadFijaMensual = parseFloat(document.getElementById('nocturnidadFijaMensual').value) || 0;
        const categoria = categoriaSelect.value;
        const mesesEspecialista = parseInt(document.getElementById('mesesComoEspecialista').value) || 0;

        // Factor de prorrateo de 15 pagas sobre 12 meses: 15 / 12 = 1.25
        const factorProrrateoPagas = 15 / 12; 
        
        // Porcentaje real pendiente de aplicar (4% total menos 2,9% ya pagado = 1,1%)
        const porcentajePendiente = 0.011;

        // 1. CÁLCULO DEL SALARIO BASE POR TRAMOS Y CATEGORÍA
        const diffHoraMozo = 0.40 * (porcentajePendiente / 0.04);
        const diffHoraEspecialista = 0.55 * (porcentajePendiente / 0.04); 

        let totalBaseAtrasos = 0;
        let desgloseTexto = "";

        if (categoria === 'cambio_especialista') {
            const mesesMozo = Math.max(0, mesesAtrasos - mesesEspecialista);
            
            const atrasosMozo = horasMensualesBase * diffHoraMozo * factorProrrateoPagas * mesesMozo;
            const atrasosEspecialista = horasMensualesBase * diffHoraEspecialista * factorProrrateoPagas * mesesEspecialista;
            
            totalBaseAtrasos = atrasosMozo + atrasosEspecialista;
            desgloseTexto = ` (${mesesMozo}m Mozo + ${mesesEspecialista}m Especialista)`;
        } else if (categoria === 'especialista') {
            totalBaseAtrasos = horasMensualesBase * diffHoraEspecialista * factorProrrateoPagas * mesesAtrasos;
            desgloseTexto = ` (Mozo Especialista)`;
        } else {
            totalBaseAtrasos = horasMensualesBase * diffHoraMozo * factorProrrateoPagas * mesesAtrasos;
            desgloseTexto = ` (Mozo)`;
        }

        if (mesesAtrasos > 0 && horasMensualesBase > 0) {
            brutoAtrasos += totalBaseAtrasos;
            const trBase = document.createElement('tr');
            trBase.innerHTML = `
                <td><strong>Salario Base (Pendiente 1.1%, 15 pagas)${desgloseTexto}</strong></td>
                <td>-</td>
                <td>-</td>
                <td class="diff-positive">Según tramos</td>
                <td><strong>+${totalBaseAtrasos.toFixed(2)} € (${mesesAtrasos} meses)</strong></td>
            `;
            tbody.appendChild(trBase);
        }

        // 2. CÁLCULO DE LA ANTIGÜEDAD (por los meses exactos indicados)
        if (mesesAntiguedad > 0 && antiguedadMensual > 0) {
            const difMensualAntiguedad = (antiguedadMensual * porcentajePendiente) * factorProrrateoPagas;
            const totalAntiguedadAtrasos = difMensualAntiguedad * mesesAntiguedad;
            brutoAtrasos += totalAntiguedadAtrasos;

            const trAntiguedad = document.createElement('tr');
            trAntiguedad.innerHTML = `
                <td><strong>Plus Antigüedad (Pendiente 1.1%)</strong></td>
                <td>${antiguedadMensual.toFixed(2)} €/mes</td>
                <td>${(antiguedadMensual * (1 + 0.04)).toFixed(2)} €/mes</td>
                <td class="diff-positive">+${difMensualAntiguedad.toFixed(2)} €/mes</td>
                <td><strong>+${totalAntiguedadAtrasos.toFixed(2)} € (${mesesAntiguedad} meses)</strong></td>
            `;
            tbody.appendChild(trAntiguedad);
        }

        // 3. CÁLCULO DEL PLUS NOCTURNIDAD FIJO MENSUAL
        if (mesesAtrasos > 0 && nocturnidadFijaMensual > 0) {
            const difMensualNocturnidad = (nocturnidadFijaMensual * porcentajePendiente) * factorProrrateoPagas;
            const totalNocturnidadAtrasos = difMensualNocturnidad * mesesAtrasos;
            brutoAtrasos += totalNocturnidadAtrasos;

            const trNocturnidad = document.createElement('tr');
            trNocturnidad.innerHTML = `
                <td><strong>Plus Nocturnidad Fijo (Pendiente 1.1%)</strong></td>
                <td>${nocturnidadFijaMensual.toFixed(2)} €/mes</td>
                <td>${(nocturnidadFijaMensual * (1 + 0.04)).toFixed(2)} €/mes</td>
                <td class="diff-positive">+${difMensualNocturnidad.toFixed(2)} €/mes</td>
                <td><strong>+${totalNocturnidadAtrasos.toFixed(2)} € (${mesesAtrasos} meses)</strong></td>
            `;
            tbody.appendChild(trNocturnidad);
        }

        // 4. CÁLCULO DEL PLUS CONVENIO
        if (mesesAtrasos > 0 && horasSemanales > 0) {
            const plusConvenioNuevoMensual = (80 * horasSemanales) / 40;
            const plusConvenioAntiguoMensual = 0;
            const difMensualConvenio = plusConvenioNuevoMensual - plusConvenioAntiguoMensual;
            const totalConvenioAtrasos = difMensualConvenio * mesesAtrasos;

            brutoAtrasos += totalConvenioAtrasos;
            const trConvenio = document.createElement('tr');
            trConvenio.innerHTML = `
                <td><strong>Plus Convenio (${horasSemanales}h/sem, 12 meses)</strong></td>
                <td>${plusConvenioAntiguoMensual.toFixed(2)} € / mes</td>
                <td>${plusConvenioNuevoMensual.toFixed(2)} € / mes</td>
                <td class="diff-positive">+${difMensualConvenio.toFixed(2)} €/mes</td>
                <td><strong>+${totalConvenioAtrasos.toFixed(2)} € (${mesesAtrasos} meses)</strong></td>
            `;
            tbody.appendChild(trConvenio);
        }

        // 5. RESTO DE CONCEPTOS POR HORAS / UNIDADES
        for (const [key, data] of Object.entries(TARIFAS)) {
            const inputVal = parseFloat(document.getElementById(key).value) || 0;
            
            const subtotalAnt = inputVal * data.ant;
            const subtotalNue = inputVal * data.nua;
            const difUnitaria = data.nua - data.ant;
            const difTotal = subtotalNue - subtotalAnt;

            brutoAtrasos += difTotal;

            if (inputVal > 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${data.nombre}</strong> (${inputVal} uds)</td>
                    <td>${data.ant.toFixed(3)} €</td>
                    <td>${data.nua.toFixed(2)} €</td>
                    <td class="diff-positive">+${difUnitaria.toFixed(2)} €</td>
                    <td><strong>+${difTotal.toFixed(2)} €</strong></td>
                `;
                tbody.appendChild(tr);
            }
        }

        // 6. MEJORA VOLUNTARIA (DEDUCCIÓN)
        const mejoraVoluntaria = parseFloat(document.getElementById('mejoraVoluntaria').value) || 0;

        if (mejoraVoluntaria > 0) {
            const trMV = document.createElement('tr');
            trMV.innerHTML = `
                <td><strong>Mejora Voluntaria (A compensar)</strong></td>
                <td>-</td>
                <td>-</td>
                <td class="diff-negative">Deducción</td>
                <td class="diff-negative"><strong>-${mejoraVoluntaria.toFixed(2)} €</strong></td>
            `;
            tbody.appendChild(trMV);
        }

        if (tbody.innerHTML === '') {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#777;">Introduce tus datos para calcular los atrasos acumulados</td></tr>`;
        }

        const netoAtrasos = brutoAtrasos - mejoraVoluntaria;

        document.getElementById('totalBruto').textContent = '+' + brutoAtrasos.toFixed(2) + ' €';
        document.getElementById('totalDeduccion').textContent = '-' + mejoraVoluntaria.toFixed(2) + ' €';
        document.getElementById('totalNeto').textContent = (netoAtrasos >= 0 ? '+' : '') + netoAtrasos.toFixed(2) + ' €';
    }

    document.querySelectorAll('#salaryForm input, #salaryForm select').forEach(input => {
        input.addEventListener('input', calcular);
        input.addEventListener('change', calcular);
    });

    calcular();
</script>

</body>
</html>
